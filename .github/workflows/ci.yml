name: CI

on:
  push:
  pull_request:

jobs:
  glibc:
    name: build (${{ matrix.cc }}, glibc)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang
        if: matrix.cc == 'clang'
      - run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror"
      - run: make test CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror"

  musl:
    name: build (${{ matrix.cc }}, musl)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    defaults:
      run:
        shell: alpine.sh {0}
    steps:
      - uses: actions/checkout@v4
      - uses: jirutka/setup-alpine@v1
        with:
          packages: build-base linux-headers clang
      - run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror"
      - run: make test CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Werror"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR init/install.sh init/elevate.sh init/runit/autologin/run tests/run.sh
